[project]
name = "poc-kanini-2-backend"
version = "0.1.0"
description = "FastAPI backend for AURA — Agentic Understanding & Retrieval Assistant (POC-Kanini-2)"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "google-genai>=1.0,<2.0",
  "nltk>=3.9,<4.0",
  "scikit-learn>=1.5,<2.0",
  "pandas>=2.0,<3.0",
  "spacy>=3.8,<4.0",
  "spacy-lookups-data>=1.0,<2.0",
  "pypdf>=5.0,<7.0",
  "pypdfium2>=4.30,<5.0",
  "pytesseract>=0.3.10,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "chromadb>=0.5,<2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "reportlab>=4.0,<5.0"]
transformer = ["transformers[torch]>=4.45,<5.0"]

[build-system]
requires = ["setuptools>=73.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
